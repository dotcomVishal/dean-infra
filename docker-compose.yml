version: '3.9'

services:
  # Stage A only (Azure): a local MySQL. Enabled with COMPOSE_PROFILES=localdb and DB_HOST=mysql.
  # At Stage B the backend uses the institute database (DB_HOST in .env) and this service is not started.
  # The backend owns the schema (migrations/*.sql); nothing is mounted into initdb.
  mysql:
    image: mysql:8.0
    container_name: dean-mysql
    profiles: ["localdb"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-infraseva}
      MYSQL_USER: ${DB_USER:-infraseva_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — no default, refusing to start with a guessable DB password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dean-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-infraseva_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — no default, refusing to start with a guessable DB password}
      DB_NAME: ${DB_NAME:-infraseva}
      # Set true in the production .env after the first successful boot: a wrong DB_NAME
      # or a wiped schema then refuses to start instead of becoming an empty install.
      INFRA_EXPECT_EXISTING_DB: ${INFRA_EXPECT_EXISTING_DB:-false}
      DB_SSL_CA: ${DB_SSL_CA:-}
      # Reverse proxies in front of the backend: host proxy + dean-proxy container.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend:5173}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # Sysadmin test tickets. Kill switch: set false in .env to disable.
      MOCK_TESTING_ENABLED: ${MOCK_TESTING_ENABLED:-true}
      GOOGLE_APPLICATION_CREDENTIALS: /app/certs/serviceAccountKey.json
    volumes:
      - ./infra-backend-v2/uploads:/app/backend/uploads
      - ./.env:/app/backend/.env:ro
      - ./infra-backend-v2/serviceAccountKey.json:/app/certs/serviceAccountKey.json:ro
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://backend:5000/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: dean-frontend
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:alpine
    container_name: dean-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - infra-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:

networks:
  infra-network:
    driver: bridge
