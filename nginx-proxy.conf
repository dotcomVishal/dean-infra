worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_http_version 1.0; # the host nginx may speak HTTP/1.0 to this proxy
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;
  client_max_body_size 100m; # multer allows 30 MB/file, up to several files

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # S9: CORS is owned by Express's cors() config alone. These headers used
    # to override it with a wildcard origin on every route, including /api.

    location = /index.html {
      proxy_pass http://frontend:5173/index.html;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      expires 0;
    }

    location = /sw.js {
      proxy_pass http://frontend:5173/sw.js;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      expires 0;
    }

    location ~* \.(?:manifest|webmanifest)$ {
      proxy_pass http://frontend:5173;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Content-Type "application/manifest+json" always;
      add_header Cache-Control "no-cache" always;
      expires 0;
    }

    location /api/ {
      proxy_pass http://backend:5000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # S2: /uploads/ is no longer proxied; files are served by GET /api/attachments/:id

    location / {
      proxy_pass http://frontend:5173/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
