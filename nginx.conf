worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    application/manifest+json webmanifest;
  }

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;
  client_max_body_size 100m; # multer allows 30 MB/file, up to several files

  server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      expires 0;
    }

    location = /sw.js {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      expires 0;
    }

    location ~* \.(?:manifest|webmanifest)$ {
      root /usr/share/nginx/html;
      add_header Content-Type "application/manifest+json" always;
      add_header Cache-Control "no-cache" always;
      expires 0;
    }

    # Hashed build output: safe to cache for a year. A missing file must 404,
    # not fall through to index.html (a stale tab would get HTML for a script).
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|ico|svg|webp)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /api/ {
      proxy_pass http://backend:5000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S2: /uploads/ is no longer proxied; files are served by GET /api/attachments/:id

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
