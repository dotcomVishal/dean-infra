name: Continuous Deployment

on:
  push:
    branches:
      - tazer

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and execute update.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            cd ~/dean-infra
            # Sync first: update.sh updates itself while running, so a changed script
            # would otherwise run in its old form on the first deploy.
            git fetch --prune origin tazer
            git checkout -q tazer
            git reset --hard origin/tazer
            chmod +x ./update.sh
            ./update.sh
